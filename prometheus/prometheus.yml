global:
  scrape_interval: 15s # Scrape data every 15 seconds ⏱

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Monitor Prometheus itself

  - job_name: 'python-app'
    static_configs:
      - targets: ['app-service:8000'] # Monitor our backend application 

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100'] # Monitor system metrics provided by Node Exporter

  - job_name: 'jmeter'
    static_configs:
      - targets: ['172.27.240.1:9270']  # Monitor the JMeter metrics port on the host machine